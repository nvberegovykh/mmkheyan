<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin — Meruzhan Mkheyan</title>
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <header class="admin-topbar">
        <h1>Admin Panel</h1>
        <nav>
            <a href="../index.html">← Back to site</a>
            <button id="logoutBtn" class="secondary" style="display:none; margin-left:10px;">Log out</button>
        </nav>
    </header>

    <!-- Login gate -->
    <main id="loginScreen" class="admin-main">
        <section>
            <h2>Sign in</h2>
            <form id="loginForm" class="controls" style="max-width:360px;">
                <label>
                    Email
                    <input type="email" id="loginEmail" autocomplete="username" required>
                </label>
                <label>
                    Password
                    <input type="password" id="loginPassword" autocomplete="current-password" required>
                </label>
                <div class="actions">
                    <button type="submit">Log in</button>
                </div>
                <div id="loginError" style="color:#b00020; font-size:13px;"></div>
            </form>
        </section>
    </main>

    <!-- Admin content (shown after auth) -->
    <main id="adminMain" class="admin-main" style="display:none;">
        <section>
            <h2>Content Items</h2>
            <p class="note">Uploaded images are automatically saved to the gallery and get an invisible watermark baked in — no visible mark, but ownership is embedded in the pixel data.</p>
            <form id="itemForm" class="controls">
                <label>
                    Type
                    <select id="itemType">
                        <option value="painting">Painting</option>
                        <option value="sculpture">Sculpture</option>
                    </select>
                </label>
                <label>
                    Image file
                    <input type="file" id="itemFile" accept="image/*">
                </label>
                <label>
                    Or image URL
                    <input type="url" id="itemUrl" placeholder="https://...">
                </label>
                <label>
                    Name
                    <input type="text" id="itemName" placeholder="Title">
                </label>
                <label>
                    Description
                    <input type="text" id="itemDesc" placeholder="Short description">
                </label>
                <label>
                    Size
                    <input type="text" id="itemSize" placeholder="e.g. 60×80 cm">
                </label>
                <label>
                    Material
                    <input type="text" id="itemMaterial" placeholder="Canvas, oil">
                </label>
                <label>
                    Technique
                    <input type="text" id="itemTechnique" placeholder="Palette knife">
                </label>
                <label>
                    Owner
                    <input type="text" id="itemOwner" placeholder="Owner or Gallery or Unknown">
                </label>
                <div class="actions">
                    <button type="submit" id="addItem">Add / Update</button>
                    <button type="button" id="cancelEdit" class="secondary" style="display:none;">Cancel edit</button>
                    <span id="uploadStatus" class="note"></span>
                </div>
            </form>
            <details class="settings">
                <summary>Site Settings</summary>
                <div class="controls">
                    <label>
                        Contacts Link
                        <input type="text" id="contactsLink" placeholder="https://...">
                    </label>
                    <label>
                        Default Language
                        <select id="defaultLang">
                            <option value="en">EN</option>
                            <option value="ru">RU</option>
                            <option value="ka">KA</option>
                        </select>
                    </label>
                    <label>
                        Auto-translate artwork info
                        <select id="autoTranslate">
                            <option value="off">Off</option>
                            <option value="on">On</option>
                        </select>
                    </label>
                    <div class="actions">
                        <button type="button" id="saveSettings">Save Settings</button>
                    </div>
                </div>
            </details>
            <div id="itemsList" class="items-list"></div>
        </section>
    </main>

    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
    <script src="../firebase-config.js"></script>
    <script src="watermark.js"></script>
    <script src="admin.js"></script>
</body>
</html>
